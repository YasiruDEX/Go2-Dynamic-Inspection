<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Visual Inspection Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0b0f1a;
      --surface:   #111827;
      --surface2:  #1a2235;
      --border:    #1f2d45;
      --accent:    #3b82f6;
      --accent2:   #6366f1;
      --pass:      #10b981;
      --fail:      #ef4444;
      --unknown:   #f59e0b;
      --text:      #e2e8f0;
      --muted:     #64748b;
      --sidebar-w: 340px;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow: hidden; }

    /* ── Top Bar ── */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; height: 56px; z-index: 100;
      background: rgba(11,15,26,0.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 24px; gap: 16px;
    }
    .topbar-logo { display: flex; align-items: center; gap: 10px; }
    .topbar-logo svg { color: var(--accent); }
    .topbar-logo span { font-weight: 700; font-size: 15px; letter-spacing: .3px; }
    .topbar-sub { font-size: 12px; color: var(--muted); margin-left: 4px; }
    .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
    .refresh-pill {
      display: flex; align-items: center; gap: 6px; font-size: 12px;
      color: var(--muted); background: var(--surface2);
      border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--pass); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    .count-badge {
      background: var(--accent); color: #fff; font-size: 11px; font-weight: 600;
      padding: 3px 9px; border-radius: 12px;
    }

    /* ── Layout ── */
    .layout {
      display: flex; height: 100vh; padding-top: 56px;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar-w); flex-shrink: 0;
      background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .sidebar-header {
      padding: 16px 16px 12px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px;
    }
    .sidebar-header h3 { font-size: 13px; font-weight: 600; color: var(--text); }
    .sidebar-search {
      margin: 0 12px 12px;
    }
    .sidebar-search input {
      width: 100%; padding: 8px 12px; font-size: 12px; font-family: 'Inter', sans-serif;
      background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); outline: none; transition: border-color .2s;
    }
    .sidebar-search input:focus { border-color: var(--accent); }
    .sidebar-search input::placeholder { color: var(--muted); }

    .sidebar-list { flex: 1; overflow-y: auto; padding: 0 8px 16px; }
    .sidebar-list::-webkit-scrollbar { width: 4px; }
    .sidebar-list::-webkit-scrollbar-track { background: transparent; }
    .sidebar-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* Event group */
    .event-group { margin-bottom: 6px; }
    .event-header {
      display: flex; align-items: center; gap: 8px; padding: 8px 10px;
      border-radius: 8px; cursor: pointer; transition: background .15s;
      border: 1px solid transparent;
    }
    .event-header:hover { background: var(--surface2); }
    .event-header.active { background: var(--surface2); border-color: var(--border); }
    .event-chevron { font-size: 10px; color: var(--muted); transition: transform .2s; flex-shrink:0; }
    .event-header.open .event-chevron { transform: rotate(90deg); }
    .event-label { font-size: 12px; font-weight: 600; color: var(--text); flex: 1; }
    .event-meta { font-size: 10px; color: var(--muted); }
    .event-count { font-size: 10px; color: var(--muted); background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1px 7px; }

    /* Waypoint item */
    .wp-list { padding-left: 12px; overflow: hidden; max-height: 0; transition: max-height .3s ease; }
    .wp-list.open { max-height: 2000px; }
    .wp-item {
      display: flex; align-items: center; gap: 8px; padding: 7px 10px;
      margin: 2px 0; border-radius: 7px; cursor: pointer;
      transition: background .15s; border-left: 2px solid transparent;
    }
    .wp-item:hover { background: var(--surface2); }
    .wp-item.selected { background: rgba(59,130,246,.12); border-left-color: var(--accent); }
    .wp-icon { flex-shrink: 0; display:flex; align-items:center; color: var(--muted); }
    .wp-text { flex: 1; min-width: 0; }
    .wp-name { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wp-class { font-size: 10px; color: var(--muted); }
    .wp-badge {
      font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 6px;
      flex-shrink: 0; letter-spacing: .3px;
    }
    .badge-pass   { background: rgba(16,185,129,.15); color: var(--pass); }
    .badge-fail   { background: rgba(239,68,68,.15);  color: var(--fail); }
    .badge-unknown{ background: rgba(245,158,11,.15); color: var(--unknown); }

    /* ── Main Content ── */
    .main {
      flex: 1; overflow-y: auto; padding: 28px 32px;
    }
    .main::-webkit-scrollbar { width: 6px; }
    .main::-webkit-scrollbar-track { background: transparent; }
    .main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* Empty state */
    .empty-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 60%; color: var(--muted); gap: 12px; text-align: center;
    }
    .empty-state svg { opacity: .3; }
    .empty-state h2 { font-size: 18px; font-weight: 600; }
    .empty-state p { font-size: 13px; }

    /* Inspection detail */
    .detail-header { margin-bottom: 24px; }
    .detail-breadcrumb {
      display: flex; align-items: center; gap: 6px; font-size: 12px;
      color: var(--muted); margin-bottom: 12px;
    }
    .breadcrumb-sep { opacity: .4; }
    .detail-title { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
    .detail-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .meta-chip {
      display: flex; align-items: center; gap: 5px; font-size: 11px;
      color: var(--muted); background: var(--surface2);
      border: 1px solid var(--border); border-radius: 6px; padding: 4px 9px;
    }

    /* Decision hero */
    .decision-hero {
      border-radius: 14px; padding: 20px 24px; margin-bottom: 24px;
      display: flex; align-items: center; gap: 20px;
      border: 1px solid;
    }
    .decision-hero.pass   { background: rgba(16,185,129,.06); border-color: rgba(16,185,129,.25); }
    .decision-hero.fail   { background: rgba(239,68,68,.06);  border-color: rgba(239,68,68,.25); }
    .decision-hero.unknown{ background: rgba(245,158,11,.06); border-color: rgba(245,158,11,.25); }
    .decision-icon { flex-shrink: 0; display:flex; align-items:center; }
    .decision-label { font-size: 28px; font-weight: 800; }
    .decision-hero.pass   .decision-label { color: var(--pass); }
    .decision-hero.fail   .decision-label { color: var(--fail); }
    .decision-hero.unknown .decision-label { color: var(--unknown); }
    .decision-summary { font-size: 13px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
    .confidence-block { margin-left: auto; text-align: right; flex-shrink: 0; }
    .confidence-num { font-size: 32px; font-weight: 800; color: var(--text); }
    .confidence-label { font-size: 11px; color: var(--muted); }
    .confidence-bar-track { height: 6px; background: var(--border); border-radius: 3px; margin-top: 6px; width: 120px; margin-left: auto; }
    .confidence-bar-fill { height: 100%; border-radius: 3px; transition: width .6s ease; }

    /* Content grid */
    .content-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
    @media (max-width: 1100px) { .content-grid { grid-template-columns: 1fr; } }

    /* Cards */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px;
    }
    .card-title { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .7px; margin-bottom: 14px; }

    /* Image */
    .image-wrap {
      border-radius: 10px; overflow: hidden; background: var(--surface2);
      border: 1px solid var(--border); aspect-ratio: 4/3;
      display: flex; align-items: center; justify-content: center;
    }
    .image-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .no-image { color: var(--muted); font-size: 12px; text-align: center; }

    /* Findings */
    .finding-item {
      display: flex; gap: 10px; padding: 9px 0;
      border-bottom: 1px solid var(--border); font-size: 17px; line-height: 1.65;
    }
    .finding-item:last-child { border-bottom: none; }
    .finding-bullet { color: var(--accent); margin-top: 2px; flex-shrink: 0; }

    /* Evidence */
    .evidence-table { width: 100%; border-collapse: collapse; }
    .evidence-table td { padding: 9px 10px; font-size: 15px; border-bottom: 1px solid var(--border); }
    .evidence-table tr:last-child td { border-bottom: none; }
    .evidence-key { color: var(--muted); width: 45%; font-weight: 500; }
    .ev-true   { color: var(--pass); font-weight: 600; }
    .ev-false  { color: var(--fail); font-weight: 600; }
    .ev-null   { color: var(--muted); font-style: italic; }
    .ev-other  { color: var(--text); }

    /* Tags */
    .tags-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      font-size: 11px; padding: 3px 10px; border-radius: 6px;
      background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
    }

    /* Edit mode */
    .edit-btn {
      margin-left: auto; display: flex; align-items: center; gap: 5px;
      font-size: 11px; font-weight: 600; color: var(--accent);
      background: rgba(59,130,246,.1); border: 1px solid rgba(59,130,246,.3);
      border-radius: 7px; padding: 4px 11px; cursor: pointer;
      font-family:'Inter',sans-serif; transition: background .15s;
    }
    .edit-btn:hover { background: rgba(59,130,246,.2); }
    .save-btn {
      display: flex; align-items: center; gap: 5px;
      font-size: 11px; font-weight: 600; color: #fff;
      background: var(--pass); border: none;
      border-radius: 7px; padding: 4px 11px; cursor: pointer;
      font-family:'Inter',sans-serif; transition: opacity .15s;
    }
    .save-btn:hover { opacity: .85; }
    .cancel-btn {
      font-size: 11px; font-weight: 600; color: var(--muted);
      background: transparent; border: 1px solid var(--border);
      border-radius: 7px; padding: 4px 11px; cursor: pointer;
      font-family:'Inter',sans-serif;
    }
    .card-header { display: flex; align-items: center; margin-bottom: 14px; }
    .card-header .card-title { margin-bottom: 0; }
    .finding-edit-area {
      width: 100%; background: var(--surface2); border: 1px solid var(--accent);
      border-radius: 7px; padding: 8px 10px; color: var(--text);
      font-family: 'Inter', sans-serif; font-size: 13px; line-height: 1.6;
      resize: vertical; min-height: 38px; margin: 3px 0;
    }
    .finding-edit-area:focus { outline: none; border-color: var(--accent2); }
    .add-finding-btn {
      margin-top: 8px; font-size: 11px; color: var(--accent); background: none;
      border: 1px dashed rgba(59,130,246,.4); border-radius: 6px;
      padding: 4px 12px; cursor: pointer; font-family:'Inter',sans-serif; width:100%;
    }
    .del-finding-btn {
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 14px; flex-shrink: 0; line-height: 1; padding: 0 2px;
      font-family:'Inter',sans-serif;
    }
    .del-finding-btn:hover { color: var(--fail); }
    .finding-edit-row { display: flex; align-items: flex-start; gap: 6px; }
    .summary-edit {
      width:100%; background: var(--surface2); border: 1px solid var(--accent);
      border-radius: 7px; padding: 7px 10px; color: var(--text);
      font-family:'Inter',sans-serif; font-size:13px; line-height:1.5;
      resize:vertical; min-height:52px;
    }
    .summary-edit:focus { outline:none; border-color:var(--accent2); }
    .decision-select {
      background: var(--surface2); border: 1px solid var(--accent);
      color: var(--text); font-family:'Inter',sans-serif; font-size:14px;
      font-weight:700; border-radius:8px; padding:4px 10px; cursor:pointer;
    }
    .save-status {
      font-size:11px; padding: 3px 10px; border-radius:6px; font-weight:600;
    }
    .save-status.ok  { color:var(--pass); background:rgba(16,185,129,.1); }
    .save-status.err { color:var(--fail); background:rgba(239,68,68,.1); }

    /* Loading */
    .loader {
      display: flex; align-items: center; justify-content: center;
      height: 100%; color: var(--muted); gap: 10px; font-size: 13px;
    }
    .spinner {
      width: 18px; height: 18px; border: 2px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast */
    .toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 999;
      background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px 18px; font-size: 12px; color: var(--text);
      display: flex; align-items: center; gap: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,.4);
      transform: translateY(80px); opacity: 0; transition: all .35s ease;
      pointer-events: none;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--pass); }
  </style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <div class="topbar-logo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <span>Visual Inspection</span>
    <span class="topbar-sub">Dashboard</span>
  </div>
  <div class="topbar-right">
    <div class="refresh-pill">
      <div class="dot"></div>
      <span id="refresh-label">Auto-refresh 15s</span>
    </div>
    <span class="count-badge" id="total-count">–</span>
  </div>
</div>

<div class="layout">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2">
        <path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/>
      </svg>
      <h3>Inspections</h3>
    </div>
    <div class="sidebar-search">
      <input type="text" id="search-input" placeholder="Search event or waypoint…"/>
    </div>
    <div class="sidebar-list" id="sidebar-list">
      <div class="loader"><div class="spinner"></div> Loading…</div>
    </div>
  </div>

  <!-- Main -->
  <div class="main" id="main-content">
    <div class="loader" style="height:100%">
      <div class="spinner"></div> Loading inspection data…
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
  <div class="toast-dot"></div>
  <span id="toast-msg">New inspection result detected</span>
</div>

<script>
let allData = [];
let selectedId = null;
let refreshTimer = null;

function getIcon(name, s=16) {
  const ic = {
    gauge:             `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`,
    door:              `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V6a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v14"/><path d="M2 20h20"/><line x1="14" y1="12" x2="14.01" y2="12"/></svg>`,
    fire_extinguisher: `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6v7a6 6 0 0 1-12 0V6"/><path d="M9 6V2"/><path d="M6 2h6"/><path d="M15 8h4a2 2 0 0 1 0 4h-4"/></svg>`,
    extinguisher:      `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6v7a6 6 0 0 1-12 0V6"/><path d="M9 6V2"/><path d="M6 2h6"/><path d="M15 8h4a2 2 0 0 1 0 4h-4"/></svg>`,
    emergency_exit:    `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
    main_cylinder:     `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>`,
    cylinder:          `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>`,
    person:            `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
    unknown:           `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
  };
  return ic[name] || `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`;
}
function getDecisionIcon(decision) {
  if (decision==='PASS')    return `<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--pass)" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`;
  if (decision==='FAIL')    return `<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--fail)" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`;
  return `<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--unknown)" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`;
}

// ── Fetch & Render ──────────────────────────────────────────────────────────

async function fetchData() {
  try {
    const res  = await fetch('/api/summary');
    const data = await res.json();

    const prevTopId = allData.length > 0 ? allData[0].id : null;
    allData = data;

    document.getElementById('total-count').textContent = data.length + ' results';

    renderSidebar(allData);

    // Auto-select latest if nothing selected
    if (!selectedId && allData.length > 0) {
      selectInspection(allData[0].id);
    }

    // Toast on new result
    if (prevTopId && allData.length > 0 && allData[0].id !== prevTopId) {
      showToast('New inspection result received!');
    }

  } catch(e) {
    console.error('Fetch error:', e);
  }
}

function scheduleRefresh() {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(async () => {
    await fetchData();
    scheduleRefresh();
  }, 15000);
}

// ── Sidebar ─────────────────────────────────────────────────────────────────

function renderSidebar(data) {
  const query = document.getElementById('search-input').value.toLowerCase();

  // Group by event_id
  const groups = {};
  for (const item of data) {
    if (query && !item.event_id.toLowerCase().includes(query) &&
        !item.waypoint_id.toLowerCase().includes(query) &&
        !item.object_class.toLowerCase().includes(query)) continue;

    if (!groups[item.event_id]) groups[item.event_id] = [];
    groups[item.event_id].push(item);
  }

  const list = document.getElementById('sidebar-list');
  list.innerHTML = '';

  // Latest event auto-open
  const latestEventId = data.length > 0 ? data[0].event_id : null;

  for (const [eventId, items] of Object.entries(groups)) {
    const isOpen   = (eventId === latestEventId || items.some(i => i.id === selectedId));
    const lastTime = items[0].timestamp;

    const group = document.createElement('div');
    group.className = 'event-group';

    const header = document.createElement('div');
    header.className = 'event-header' + (isOpen ? ' open' : '');
    header.innerHTML = `
      <span class="event-chevron">▶</span>
      <span class="event-label">${eventId}</span>
      <span class="event-count">${items.length}</span>
    `;
    header.addEventListener('click', () => {
      header.classList.toggle('open');
      wpList.classList.toggle('open');
    });
    group.appendChild(header);

    const wpList = document.createElement('div');
    wpList.className = 'wp-list' + (isOpen ? ' open' : '');

    for (const item of items) {
      const decision = (item.result.decision || 'UNKNOWN').toUpperCase();
      const badge    = `<span class="wp-badge badge-${decision.toLowerCase()}">${decision}</span>`;
      const icon     = getIcon(item.object_class);

      const wp = document.createElement('div');
      wp.className = 'wp-item' + (item.id === selectedId ? ' selected' : '');
      wp.dataset.id = item.id;
      wp.innerHTML = `
        <span class="wp-icon">${icon}</span>
        <div class="wp-text">
          <div class="wp-name">${item.waypoint_id} · ${item.instance_id}</div>
          <div class="wp-class">${item.object_class} &nbsp;·&nbsp; ${item.timestamp}</div>
        </div>
        ${badge}
      `;
      wp.addEventListener('click', () => selectInspection(item.id));
      wpList.appendChild(wp);
    }

    group.appendChild(wpList);
    list.appendChild(group);
  }
}

// ── Detail View ─────────────────────────────────────────────────────────────

function selectInspection(id) {
  selectedId = id;

  // Update sidebar highlight
  document.querySelectorAll('.wp-item').forEach(el => {
    el.classList.toggle('selected', el.dataset.id === id);
  });

  const item = allData.find(i => i.id === id);
  if (!item) return;

  const r = item.result;
  const decision  = (r.decision  || 'UNKNOWN').toUpperCase();
  const confidence = typeof r.confidence === 'number' ? r.confidence : 0;
  const confPct   = Math.round(confidence * 100);
  const dClass    = decision.toLowerCase();
  const dIcon     = getDecisionIcon(decision);
  const icon      = getIcon(item.object_class);

  // Findings HTML
  const findings = Array.isArray(r.findings) && r.findings.length > 0
    ? r.findings.map(f => `<div class="finding-item"><span class="finding-bullet">›</span>${escHtml(f)}</div>`).join('')
    : '<div class="finding-item"><span class="finding-bullet">›</span><em style="color:var(--muted)">No findings recorded.</em></div>';

  // Evidence HTML
  let evidenceHtml = '';
  if (r.evidence && Object.keys(r.evidence).length > 0) {
    for (const [k, v] of Object.entries(r.evidence)) {
      let cls = 'ev-other', display = String(v);
      if (v === true)  { cls = 'ev-true';  display = '✓ Yes'; }
      if (v === false) { cls = 'ev-false'; display = '✗ No'; }
      if (v === null)  { cls = 'ev-null';  display = 'Unknown'; }
      evidenceHtml += `<tr><td class="evidence-key">${escHtml(k)}</td><td class="${cls}">${escHtml(display)}</td></tr>`;
    }
  } else {
    evidenceHtml = `<tr><td colspan="2" style="color:var(--muted);font-size:12px;padding:12px 0">No evidence data.</td></tr>`;
  }

  // Tags
  const tags = (r.extracted_objects || []).map(o => `<span class="tag">${escHtml(o)}</span>`).join('');

  // Image src
  const imgHtml = item.has_image
    ? `<img src="${item.image_url}" alt="Inspection image" loading="lazy" onerror="this.parentElement.innerHTML='<div class=no-image>Image not available</div>'"/>`
    : `<div class="no-image">No image saved</div>`;

  // Gauge special: show reading
  let gaugeReading = '';
  if (item.object_class === 'gauge' && Array.isArray(r.findings) && r.findings.length > 0) {
    const val = r.findings[0];
    if (typeof val === 'number') {
      gaugeReading = `<div class="meta-chip"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg> Reading: <strong style="color:var(--text);margin-left:4px">${val.toFixed(2)}</strong></div>`;
    }
  }

  // Confidence bar colour
  const barColor = dClass === 'pass' ? 'var(--pass)' : dClass === 'fail' ? 'var(--fail)' : 'var(--unknown)';

  const html = `
    <div class="detail-header">
      <div class="detail-breadcrumb">
        <span>${item.event_id}</span>
        <span class="breadcrumb-sep">›</span>
        <span>${item.waypoint_id}</span>
        <span class="breadcrumb-sep">›</span>
        <span>${item.object_class}</span>
        <span class="breadcrumb-sep">›</span>
        <span>${item.instance_id}</span>
      </div>
      <div class="detail-title">${icon} ${item.object_class.replace(/_/g,' ').replace(/\b\w/g,l=>l.toUpperCase())} Inspection</div>
      <div class="detail-meta">
        <div class="meta-chip"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> ${item.timestamp}</div>
        <div class="meta-chip"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg> ${item.waypoint_id}</div>
        ${gaugeReading}
      </div>
    </div>

    <div class="decision-hero ${dClass}">
      <div class="decision-icon">${dIcon}</div>
      <div style="flex:1">
        <div id="edit-decision"><div class="decision-label">${decision}</div></div>
        <div id="edit-summary"><div class="decision-summary">${escHtml(r.summary || 'No summary available.')}</div></div>
      </div>
      ${item.object_class !== 'gauge' ? `
      <div class="confidence-block">
        <div class="confidence-num">${confPct}%</div>
        <div class="confidence-label">Confidence</div>
        <div class="confidence-bar-track">
          <div class="confidence-bar-fill" style="width:${confPct}%;background:${barColor}"></div>
        </div>
      </div>` : ''}
    </div>

    <div class="content-grid">
      <div class="card">
        <div class="card-title">Inspection Image</div>
        <div class="image-wrap">${imgHtml}</div>
      </div>
      <div class="card">
        <div class="card-header">
          <span class="card-title">Findings</span>
          <span id="edit-action-btn">
            <button class="edit-btn" onclick="enterEditMode()"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> Edit</button>
          </span>
        </div>
        <div id="findings-body">${findings}</div>
        ${tags ? `<div style="margin-top:16px"><div class="card-title" style="margin-bottom:10px">Detected Objects</div><div class="tags-wrap">${tags}</div></div>` : ''}
      </div>
    </div>

    <div class="card">
      <div class="card-title">Evidence</div>
      <table class="evidence-table"><tbody>${evidenceHtml}</tbody></table>
    </div>
  `;

  document.getElementById('main-content').innerHTML = html;
}

// ── Helpers ──────────────────────────────────────────────────────────────────

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}

// ── Search ────────────────────────────────────────────────────────────────────
document.getElementById('search-input').addEventListener('input', () => renderSidebar(allData));

// ── Editable Findings ────────────────────────────────────────────────────────

let editingId = null;

function enterEditMode() {
  const item = allData.find(i => i.id === selectedId);
  if (!item) return;
  editingId = selectedId;
  const r = item.result;

  // Replace decision label with select
  const decEl = document.getElementById('edit-decision');
  if (decEl) {
    decEl.innerHTML = `
      <select class="decision-select" id="dec-select">
        <option value="PASS"    ${r.decision==='PASS'   ?'selected':''}>PASS</option>
        <option value="FAIL"    ${r.decision==='FAIL'   ?'selected':''}>FAIL</option>
        <option value="UNKNOWN" ${r.decision==='UNKNOWN'?'selected':''}>UNKNOWN</option>
      </select>`;
  }

  // Replace summary with textarea
  const sumEl = document.getElementById('edit-summary');
  if (sumEl) {
    sumEl.innerHTML = `<textarea class="summary-edit" id="sum-edit">${escHtml(r.summary||'')}</textarea>`;
  }

  // Replace findings with editable rows
  const fEl = document.getElementById('findings-body');
  if (fEl) {
    const rows = (r.findings || []).map((f,i) => `
      <div class="finding-edit-row" id="fr-${i}">
        <textarea class="finding-edit-area" data-idx="${i}">${escHtml(String(f))}</textarea>
        <button class="del-finding-btn" onclick="deleteFinding(${i})">✕</button>
      </div>`).join('');
    fEl.innerHTML = rows + `<button class="add-finding-btn" onclick="addFinding()">＋ Add finding</button>`;
  }

  // Swap buttons
  document.getElementById('edit-action-btn').innerHTML = `
    <button class="save-btn" onclick="saveEdits()"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Save</button>
    <button class="cancel-btn" onclick="selectInspection(selectedId)">Cancel</button>
    <span class="save-status" id="save-status"></span>`;
}

function deleteFinding(idx) {
  const el = document.getElementById(`fr-${idx}`);
  if (el) el.remove();
}

function addFinding() {
  const btn = document.querySelector('.add-finding-btn');
  const idx = Date.now();
  const row = document.createElement('div');
  row.className = 'finding-edit-row';
  row.id = `fr-${idx}`;
  row.innerHTML = `<textarea class="finding-edit-area" data-idx="${idx}"></textarea>
    <button class="del-finding-btn" onclick="this.parentElement.remove()">✕</button>`;
  btn.parentElement.insertBefore(row, btn);
  row.querySelector('textarea').focus();
}

async function saveEdits() {
  const item = allData.find(i => i.id === editingId);
  if (!item) return;

  const statusEl = document.getElementById('save-status');
  statusEl.textContent = 'Saving…';
  statusEl.className = 'save-status';

  // Collect decision
  const decSel = document.getElementById('dec-select');
  const newDecision = decSel ? decSel.value : item.result.decision;

  // Collect summary
  const sumEl = document.getElementById('sum-edit');
  const newSummary = sumEl ? sumEl.value : item.result.summary;

  // Collect findings (preserve order by DOM position)
  const areas = document.querySelectorAll('#findings-body .finding-edit-area');
  const newFindings = Array.from(areas).map(a => a.value).filter(v => v.trim() !== '');

  const updated = { ...item.result, decision: newDecision, summary: newSummary, findings: newFindings };

  try {
    const [e,w,c,ins] = editingId.split('/');
    const resp = await fetch(`/api/result/${e}/${w}/${c}/${ins}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(updated)
    });
    const data = await resp.json();
    if (data.success) {
      // Update in-memory data
      item.result = updated;
      statusEl.textContent = '✓ Saved';
      statusEl.className = 'save-status ok';
      setTimeout(() => selectInspection(editingId), 900);
    } else {
      statusEl.textContent = '✗ ' + (data.error || 'Error');
      statusEl.className = 'save-status err';
    }
  } catch(e) {
    statusEl.textContent = '✗ Network error';
    statusEl.className = 'save-status err';
  }
}

// ── Init ──────────────────────────────────────────────────────────────────────
fetchData().then(scheduleRefresh);
</script>

</html>
