[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vi-server"
version = "0.1.0"
description = "Visual Inspection Server for Robot ROI Processing"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Visual Inspection Team"}
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pillow>=10.1.0",
    "python-multipart>=0.0.6",
    "aiosqlite>=0.19.0",
    "pyyaml>=6.0",
    "openai>=1.0.0",
    # Gauge pipeline dependencies
    "torch==2.0.0",
    "torchvision==0.15.1",
    "mmengine==0.7.2",
    "mmdet==3.0.0",
    "mmocr==1.0.0",
    "ultralytics==8.0.66",
    "scikit-learn==1.2.2",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["sample_images*", "scripts*", "data*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
